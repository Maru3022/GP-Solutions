name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check

      - name: Run SpotBugs
        run: ./mvnw -B spotbugs:check

      - name: Run Enforcer
        run: ./mvnw -B enforcer:enforce@enforce-versions

  unit-tests:
    name: Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test

  integration-tests:
    name: Integration Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests and coverage gate
        run: ./mvnw -B verify -DskipDependencyCheck=true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "Running OWASP Dependency Check with NVD API key"
            ./mvnw -B dependency-check:check -DnvdApiKey=${NVD_API_KEY} -DnvdApiDelay=5000
          else
            echo "::warning::NVD_API_KEY not set. Skipping OWASP Dependency Check to avoid NVD API rate limiting."
            echo "To enable this scan, add NVD_API_KEY to repository secrets."
            echo "Get your free API key from: https://nvd.nist.gov/developers/request-an-api-key"
            exit 0
          fi

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: error

  docker-verify:
    name: Docker Build, Scan & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, integration-tests, security-scan, docker-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hotel-api:test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hotel-api:test
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Start container for smoke test
        run: |
          echo "Starting Docker container for smoke test..."
          docker run -d --name hotel-api-smoke -p 8092:8092 \
            -e SPRING_PROFILES_ACTIVE=h2 \
            -e SERVER_PORT=8092 \
            hotel-api:test
          echo "Container started, waiting for application..."
          sleep 5
          echo "Container status:"
          docker ps -a | grep hotel-api-smoke

      - name: Wait for application health
        run: |
          echo "Waiting for application to become healthy..."
          MAX_ATTEMPTS=30
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if curl -sf http://localhost:8092/actuator/health > /dev/null 2>&1; then
              echo "✅ Application is healthy!"
              echo "Health response:"
              curl -s http://localhost:8092/actuator/health | head -20
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          echo "❌ Application failed to become healthy after $MAX_ATTEMPTS attempts"
          echo "Container logs:"
          docker logs hotel-api-smoke 2>&1 | tail -50
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: |
          echo "=== CONTAINER LOGS ==="
          docker logs hotel-api-smoke 2>&1 || echo "Container not found"
          echo "=== CONTAINER STATUS ==="
          docker ps -a | grep hotel-api-smoke || echo "No container found"

      - name: Cleanup container
        if: always()
        run: |
          echo "Cleaning up container..."
          docker stop hotel-api-smoke 2>/dev/null || echo "Container already stopped"
          docker rm hotel-api-smoke 2>/dev/null || echo "Container already removed"
          echo "Cleanup complete"

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gp-solutions
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
