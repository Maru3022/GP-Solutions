name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check

      - name: Run SpotBugs
        run: ./mvnw -B spotbugs:check

      - name: Run Enforcer
        run: ./mvnw -B enforcer:enforce@enforce-versions

  unit-tests:
    name: Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test

  integration-tests:
    name: Integration Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests and coverage gate
        run: ./mvnw -B verify -DskipDependencyCheck=true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "Running OWASP Dependency Check with NVD API key"
            ./mvnw -B dependency-check:check -DnvdApiKey=${NVD_API_KEY} -DnvdApiDelay=5000
          else
            echo "::warning::NVD_API_KEY not set. Skipping OWASP Dependency Check to avoid NVD API rate limiting."
            echo "To enable this scan, add NVD_API_KEY to repository secrets."
            echo "Get your free API key from: https://nvd.nist.gov/developers/request-an-api-key"
            exit 0
          fi

      - name: Upload OWASP report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: error

  docker-verify:
    name: Docker Build, Scan & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, integration-tests, security-scan, docker-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hotel-api:test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: hotel-api:test
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Start container for smoke test
        run: |
          docker run -d --name hotel-api-smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=h2 \
            hotel-api:test

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            echo "Attempt $i..."
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to become healthy"
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs hotel-api-smoke

      - name: Cleanup container
        if: always()
        run: docker stop hotel-api-smoke && docker rm hotel-api-smoke

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gp-solutions
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
